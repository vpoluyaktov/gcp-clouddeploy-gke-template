# Default values for gcp-clouddeploy-gke-template
# Override per environment in values-staging.yaml / values-production.yaml

replicaCount: 2

# Service uses NodePort because traffic is routed through a GKE Ingress (not a LoadBalancer).
# The Ingress handles external traffic, SSL termination, and HTTP-to-HTTPS redirect.
service:
  type: NodePort
  port: 80
  targetPort: 8080

# Ingress configuration for HTTPS access via Google-managed SSL certificates.
# The static IP name and domain are set per environment in values-<env>.yaml.
# IMPORTANT: The staticIPName must match the Terraform google_compute_global_address resource name.
ingress:
  enabled: true
  domain: ""
  staticIPName: ""

serviceAccount:
  name: gcp-clouddeploy-gke-template
  gcpServiceAccount: ""

app:
  port: "8080"
  environment: ""
  version: ""
  projectId: ""
  firestoreDatabaseName: gcp-clouddeploy-gke-template

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
