# Service uses NodePort because external traffic is routed through a GKE Ingress.
# The Ingress (see ingress.yaml) handles SSL termination and static IP assignment.
apiVersion: v1
kind: Service
metadata:
  name: gcp-clouddeploy-gke-template
  labels:
    app: gcp-clouddeploy-gke-template
spec:
  type: NodePort
  selector:
    app: gcp-clouddeploy-gke-template
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
