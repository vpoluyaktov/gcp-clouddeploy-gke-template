apiVersion: v1
kind: Service
metadata:
  name: gcp-clouddeploy-gke-template
  labels:
    app: gcp-clouddeploy-gke-template
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.staticIP }}
  loadBalancerIP: {{ .Values.service.staticIP }}
  {{- end }}
  selector:
    app: gcp-clouddeploy-gke-template
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
