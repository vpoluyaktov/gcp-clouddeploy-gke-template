name: Test

on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main, stage ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('service/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: ./service
      run: go mod download

    - name: Run tests
      working-directory: ./service
      run: go test ./...

    - name: Run go vet
      working-directory: ./service
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        working-directory: ./service
        version: latest
