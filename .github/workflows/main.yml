name: Deploy to GKE

on:
  # Auto-deploy only when app, infra, or deploy config changes
  push:
    branches: [ main, stage ]
    paths:
      - 'service/**'
      - 'helm/**'
      - 'terraform/**'
      - 'skaffold.yaml'
      - 'VERSION'
  pull_request:
    branches: [ main, stage ]
  # Manual trigger for on-demand deploys
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stage

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('service/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: ./service
      run: go mod download

    - name: Run tests
      working-directory: ./service
      run: go test ./...

    - name: Run go vet
      working-directory: ./service
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        working-directory: ./service
        version: latest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'))
      || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine environment
      id: env
      run: |
        # workflow_dispatch uses the input; push uses the branch
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
          ENV="prod"
        else
          ENV="stage"
        fi

        if [ "$ENV" == "prod" ]; then
          echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          echo "ENV_DIR=prod" >> $GITHUB_OUTPUT
          echo "VAR_FILE=prod/prod.tfvars" >> $GITHUB_OUTPUT
          echo "PROJECT_ID=dfh-prod-id" >> $GITHUB_OUTPUT
        else
          echo "ENV_NAME=stage" >> $GITHUB_OUTPUT
          echo "ENV_DIR=stage" >> $GITHUB_OUTPUT
          echo "VAR_FILE=stage/stage.tfvars" >> $GITHUB_OUTPUT
          echo "PROJECT_ID=dfh-stage-id" >> $GITHUB_OUTPUT
        fi

    # IMPORTANT: Auth is split into two conditional steps instead of using a ternary expression.
    # The GitHub Actions expression '${{ A && B || C }}' is NOT a true ternary — if B is falsy
    # (e.g., the secret is empty), it falls through to C. This could cause staging to
    # authenticate with the production key if the staging secret is missing.
    - name: Authenticate to Google Cloud (staging)
      if: steps.env.outputs.ENV_NAME == 'stage'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_STAGE_SA_KEY }}

    - name: Authenticate to Google Cloud (production)
      if: steps.env.outputs.ENV_NAME == 'prod'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.0"

    - name: Get version
      id: version
      run: |
        BASE_VERSION=$(cat VERSION)
        COMMIT_COUNT=$(git rev-list --all --count HEAD)
        MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)
        VERSION="$MAJOR_MINOR.$COMMIT_COUNT"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Deploy infrastructure with Terraform
      id: terraform
      run: |
        cd terraform
        cp ${{ steps.env.outputs.ENV_DIR }}/backend.tf backend.tf
        terraform init
        terraform plan -var-file="${{ steps.env.outputs.VAR_FILE }}" -var="image_tag=v${{ steps.version.outputs.VERSION }}"
        terraform apply -var-file="${{ steps.env.outputs.VAR_FILE }}" -var="image_tag=v${{ steps.version.outputs.VERSION }}" -auto-approve

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build Docker image
      run: |
        docker build \
          -t us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:v${{ steps.version.outputs.VERSION }} \
          -t us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:latest \
          -f service/Dockerfile service/

    - name: Push Docker image
      run: |
        docker push us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:v${{ steps.version.outputs.VERSION }}
        docker push us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:latest

    # Only the app version is injected dynamically at CI time.
    # The static IP is referenced by NAME (not address) in the Ingress annotation,
    # and that name is already committed in the per-environment values files.
    - name: Inject dynamic Helm values
      run: |
        VERSION=v${{ steps.version.outputs.VERSION }}
        printf 'app:\n  version: "%s"\n' "${VERSION}" > helm/values-dynamic.yaml
        cat helm/values-dynamic.yaml

    - name: Create Cloud Deploy release
      run: |
        VERSION=v${{ steps.version.outputs.VERSION }}
        PROJECT_ID=${{ steps.env.outputs.PROJECT_ID }}
        ENV_NAME=${{ steps.env.outputs.ENV_NAME }}
        SERVICE_NAME=gcp-clouddeploy-gke-template-${ENV_NAME}
        PIPELINE_NAME=${SERVICE_NAME}-pipeline
        IMAGE=us-central1-docker.pkg.dev/${PROJECT_ID}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:${VERSION}
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        RELEASE_NAME="rel-${VERSION//./-}-${SHORT_SHA}"

        # --source=. is required to upload the Helm chart and values files
        # for Cloud Deploy to render via Skaffold.
        gcloud deploy releases create ${RELEASE_NAME} \
          --project=${PROJECT_ID} \
          --region=us-central1 \
          --delivery-pipeline=${PIPELINE_NAME} \
          --skaffold-file=skaffold.yaml \
          --source=. \
          --images=gcp-clouddeploy-gke-template=${IMAGE}

    - name: Wait for rollout and smoke test
      run: |
        echo "Cloud Deploy release created. Waiting for rollout..."
        # Ingress + managed certificate provisioning takes longer than a simple LoadBalancer
        sleep 60
        PROJECT_ID=${{ steps.env.outputs.PROJECT_ID }}
        ENV_NAME=${{ steps.env.outputs.ENV_NAME }}
        CLUSTER_NAME=gcp-clouddeploy-gke-tpl-${ENV_NAME}
        # Install the GKE auth plugin (required for kubectl access to GKE clusters)
        sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin 2>/dev/null || true
        gcloud container clusters get-credentials ${CLUSTER_NAME} --region=us-central1 --project=${PROJECT_ID}
        kubectl rollout status deployment/gcp-clouddeploy-gke-template --timeout=300s || true
        # Smoke test uses HTTPS via the custom domain (routed through Ingress)
        if [ "$ENV_NAME" == "prod" ]; then
          DOMAIN="gcp-clouddeploy-gke-template.demo.devops-for-hire.com"
        else
          DOMAIN="gcp-clouddeploy-gke-template.stage.demo.devops-for-hire.com"
        fi
        echo "Service available at https://$DOMAIN"
        curl -f --max-time 10 https://$DOMAIN/health || echo "HTTPS health check not yet available (certificate may still be provisioning — this is expected for up to 60 minutes after first deploy)"

    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "[${{ steps.env.outputs.ENV_NAME }}] Deployment successful"
          echo "Version deployed: v${{ steps.version.outputs.VERSION }}"
        else
          echo "[${{ steps.env.outputs.ENV_NAME }}] Deployment failed"
        fi
