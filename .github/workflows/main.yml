name: Deploy to GKE

on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main, stage ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('service/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: ./service
      run: go mod download

    - name: Run tests
      working-directory: ./service
      run: go test ./...

    - name: Run go vet
      working-directory: ./service
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        working-directory: ./service
        version: latest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Determine environment
      id: env
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          echo "ENV_DIR=prod" >> $GITHUB_OUTPUT
          echo "VAR_FILE=prod/prod.tfvars" >> $GITHUB_OUTPUT
          echo "PROJECT_ID=dfh-prod-id" >> $GITHUB_OUTPUT
        else
          echo "ENV_NAME=stage" >> $GITHUB_OUTPUT
          echo "ENV_DIR=stage" >> $GITHUB_OUTPUT
          echo "VAR_FILE=stage/stage.tfvars" >> $GITHUB_OUTPUT
          echo "PROJECT_ID=dfh-stage-id" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ steps.env.outputs.ENV_NAME == 'prod' && secrets.GCP_PROD_SA_KEY || secrets.GCP_STAGE_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.0"

    - name: Get version
      id: version
      run: |
        BASE_VERSION=$(cat VERSION)
        COMMIT_COUNT=$(git rev-list --all --count HEAD)
        MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)
        VERSION="$MAJOR_MINOR.$COMMIT_COUNT"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ steps.env.outputs.PROJECT_ID }}-docker.pkg.dev --quiet 2>/dev/null || gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build Docker image
      run: |
        docker build \
          -t us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:v${{ steps.version.outputs.VERSION }} \
          -t us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:latest \
          -f service/Dockerfile service/

    - name: Push Docker image
      run: |
        docker push us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:v${{ steps.version.outputs.VERSION }}
        docker push us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:latest

    - name: Deploy infrastructure with Terraform
      run: |
        cd terraform
        cp ${{ steps.env.outputs.ENV_DIR }}/backend.tf backend.tf
        terraform init
        terraform plan -var-file="${{ steps.env.outputs.VAR_FILE }}" -var="image_tag=v${{ steps.version.outputs.VERSION }}"
        terraform apply -var-file="${{ steps.env.outputs.VAR_FILE }}" -var="image_tag=v${{ steps.version.outputs.VERSION }}" -auto-approve

    - name: Create Cloud Deploy release
      run: |
        VERSION=v${{ steps.version.outputs.VERSION }}
        PROJECT_ID=${{ steps.env.outputs.PROJECT_ID }}
        ENV_NAME=${{ steps.env.outputs.ENV_NAME }}
        SERVICE_NAME=gcp-clouddeploy-gke-template-${ENV_NAME}
        PIPELINE_NAME=${SERVICE_NAME}-pipeline
        IMAGE=us-central1-docker.pkg.dev/${PROJECT_ID}/gcp-clouddeploy-gke-template/gcp-clouddeploy-gke-template:${VERSION}
        RELEASE_NAME="${SERVICE_NAME}-${VERSION//./-}-$(date +%s)"

        gcloud deploy releases create ${RELEASE_NAME} \
          --project=${PROJECT_ID} \
          --region=us-central1 \
          --delivery-pipeline=${PIPELINE_NAME} \
          --skaffold-file=skaffold.yaml \
          --images=IMAGE_TAG=${IMAGE}

    - name: Wait for rollout and smoke test
      run: |
        echo "Cloud Deploy release created. Waiting for rollout..."
        sleep 30
        PROJECT_ID=${{ steps.env.outputs.PROJECT_ID }}
        ENV_NAME=${{ steps.env.outputs.ENV_NAME }}
        CLUSTER_NAME=gcp-clouddeploy-gke-tpl-${ENV_NAME}
        gcloud container clusters get-credentials ${CLUSTER_NAME} --region=us-central1 --project=${PROJECT_ID}
        kubectl rollout status deployment/gcp-clouddeploy-gke-template --timeout=300s || true
        EXTERNAL_IP=$(kubectl get svc gcp-clouddeploy-gke-template -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        if [ -n "$EXTERNAL_IP" ]; then
          echo "Service available at http://$EXTERNAL_IP"
          curl -f http://$EXTERNAL_IP/health || echo "Health check not yet available (LoadBalancer may still be provisioning)"
        else
          echo "LoadBalancer IP not yet assigned — service is deploying"
        fi

    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "[${{ steps.env.outputs.ENV_NAME }}] Deployment successful"
          echo "Version deployed: v${{ steps.version.outputs.VERSION }}"
        else
          echo "[${{ steps.env.outputs.ENV_NAME }}] Deployment failed"
        fi
