steps:
  # Step 1: Compute version from VERSION file + commit count
  - name: 'gcr.io/cloud-builders/git'
    id: 'compute-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BASE_VERSION=$(cat VERSION)
        COMMIT_COUNT=$(git rev-list --all --count HEAD)
        MAJOR_MINOR=$(echo $${BASE_VERSION} | cut -d. -f1,2)
        VERSION="$${MAJOR_MINOR}.$${COMMIT_COUNT}"
        echo "$${VERSION}" > /workspace/computed_version.txt
        echo "Computed version: $${VERSION}"

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VERSION=$(cat /workspace/computed_version.txt)
        docker build \
          -t ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:v$${VERSION} \
          -t ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest \
          -f service/Dockerfile service/

  # Step 3: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VERSION=$(cat /workspace/computed_version.txt)
        docker push ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:v$${VERSION}
        docker push ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest

  # Step 4: Create Cloud Deploy release
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-release'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VERSION=$(cat /workspace/computed_version.txt)
        IMAGE=${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:v$${VERSION}
        RELEASE_NAME="${_SERVICE_NAME}-v$(echo $${VERSION} | tr '.' '-')-$(date +%s)"
        gcloud deploy releases create $${RELEASE_NAME} \
          --project=${PROJECT_ID} \
          --region=${_DEPLOY_REGION} \
          --delivery-pipeline=${_PIPELINE_NAME} \
          --images=IMAGE_TAG=$${IMAGE} \
          --set-env-vars=APP_VERSION_VALUE=v$${VERSION},ENVIRONMENT_VALUE=${_ENVIRONMENT},GCP_PROJECT_ID_VALUE=${PROJECT_ID},FIRESTORE_DATABASE_NAME_VALUE=${_FIRESTORE_DB_NAME}

substitutions:
  _AR_REGION: us-central1
  _AR_REPOSITORY: gcp-clouddeploy-gke-template
  _SERVICE_NAME: gcp-clouddeploy-gke-template
  _DEPLOY_REGION: us-central1
  _PIPELINE_NAME: gcp-clouddeploy-gke-template
  _ENVIRONMENT: staging
  _FIRESTORE_DB_NAME: gcp-clouddeploy-gke-template

options:
  logging: CLOUD_LOGGING_ONLY
