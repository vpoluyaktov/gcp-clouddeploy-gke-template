apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-clouddeploy-gke-template
  labels:
    app: gcp-clouddeploy-gke-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gcp-clouddeploy-gke-template
  template:
    metadata:
      labels:
        app: gcp-clouddeploy-gke-template
    spec:
      serviceAccountName: gcp-clouddeploy-gke-template
      containers:
        - name: gcp-clouddeploy-gke-template
          image: IMAGE_TAG
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: ENVIRONMENT_VALUE
            - name: APP_VERSION
              value: APP_VERSION_VALUE
            - name: GCP_PROJECT_ID
              value: GCP_PROJECT_ID_VALUE
            - name: FIRESTORE_DATABASE_NAME
              value: FIRESTORE_DATABASE_NAME_VALUE
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
